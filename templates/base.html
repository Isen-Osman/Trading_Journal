<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osman — Trading Journal</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-container">
    <div class="logo">
      <div class="logo-icon">
        <div class="logo-trend">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="logo-text">Osman <span>JOURNAL</span></div>
    </div>
    <ul class="nav-links">
      <li class="nav-item active" onclick="switchTab('journal')">📊 Journal</li>
      <li class="nav-item" onclick="switchTab('ai')">✨ AI Analysis</li>
      <li class="nav-item" onclick="switchTab('news')">🔥 Forex News</li>
      <li class="nav-item" onclick="switchTab('vault')">🏦 Vault</li>
      <li class="nav-item" onclick="switchTab('stats')">📈 Statistics</li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      <div class="header-date" id="currentDate"></div>
    </div>
  </div>
</nav>

<div class="container">
  {% include 'components/journal.html' %}
  {% include 'components/ai_coach.html' %}
  {% include 'components/news_panel.html' %}
  {% include 'components/vault.html' %}
  {% include 'components/statistics.html' %}
</div>

<div class="toast" id="toast"></div>

<!-- SOCKET.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
