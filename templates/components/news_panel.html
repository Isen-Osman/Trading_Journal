<div id="news-tab" class="tab-content">
  <div class="main-grid">
    <div>
      <div class="form-section" style="border-color: #f97316;">
        <div class="section-title" style="color: #f97316; display: flex; justify-content: space-between; align-items: center;">
          <span>// Економски Календар</span>
          <div class="news-modes">
            <button class="mode-btn active" onclick="toggleNewsMode('live')">📡 ВО ЖИВО</button>
            <button class="mode-btn" onclick="toggleNewsMode('weekly')">📅 НЕДЕЛНО</button>
          </div>
        </div>

        <!-- Live News View -->
        <div id="liveNewsView">
          <div id="newsList" class="news-list">
            <div class="empty-state">Чекање на нови економски податоци... 📡</div>
          </div>
        </div>

        <!-- Weekly News View -->
        <div id="weeklyNewsView" style="display: none;">
          <div class="day-selector">
            <button class="day-btn active" onclick="filterWeeklyDay('Monday')">ПОН</button>
            <button class="day-btn" onclick="filterWeeklyDay('Tuesday')">ВТО</button>
            <button class="day-btn" onclick="filterWeeklyDay('Wednesday')">СРЕ</button>
            <button class="day-btn" onclick="filterWeeklyDay('Thursday')">ЧЕТ</button>
            <button class="day-btn" onclick="filterWeeklyDay('Friday')">ПЕТ</button>
          </div>
          <div id="weeklyNewsList" class="news-list" style="margin-top: 20px;">
            <!-- Неделните вести ќе се појават тука -->
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="rules-card" style="border-color: #f97316;">
        <div class="section-title" style="color: #f97316;">// Паника Сигнал</div>
        <div id="panicBox" class="panic-box">Системот е мирен. ✅</div>
      </div>
    </div>
  </div>
</div>
