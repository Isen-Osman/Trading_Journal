<div id="stats-tab" class="tab-content">
  <div class="stats-bar" id="statsBar" style="padding-top: 0;">
    <div class="stat-card gold"><div class="stat-label">Вкупно Трејдови</div><div class="stat-value neutral" id="statTotal">0</div></div>
    <div class="stat-card green"><div class="stat-label">Win Rate</div><div class="stat-value positive" id="statWinRate">0%</div></div>
    <div class="stat-card red"><div class="stat-label">Вкупен П&Л</div><div class="stat-value" id="statPnL">$0.00</div></div>
    <div class="stat-card purple"><div class="stat-label">Просечен R:R</div><div class="stat-value neutral" id="statRR">0:0</div></div>
  </div>
  
  <div class="chart-section" style="margin-top: 20px;">
    <div class="section-title">// Профитна Крива (Cumulative P&L)</div>
    <div class="chart-container" style="position: relative; height:450px; width:100%; padding: 0 20px 20px;">
      <canvas id="profitChart"></canvas>
    </div>
  </div>
</div>
